android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=false
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2048m
# NOTE: Gradle 8.14 needs JDK 17–21 (AGP 8.13). It cannot run on JDK 25/26.
# The JDK location is machine-specific, so set `org.gradle.java.home` in your
# *user-level* ~/.gradle/gradle.properties (gitignored by virtue of living
# outside the repo) rather than committing a path here. Examples:
#   macOS (Homebrew):  org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
#   Windows (Android Studio JBR):  org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr
